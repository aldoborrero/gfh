name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - next
    tags:
      - v*

# A newer push to the same ref makes the older run moot. Tags always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # Evaluation only: catches a nixpkgs change that breaks another system
      # (e.g. darwin.apple_sdk removal) without needing that runner.
      - run: nix flake check --all-systems --no-build
      - run: nix flake check --print-build-logs

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runs-on: ubuntu-latest
          - name: linux-aarch64
            runs-on: ubuntu-24.04-arm
          # Apple silicon only: nixpkgs 26.11 dropped x86_64-darwin.
          - name: macos-aarch64
            runs-on: macos-latest
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - run: nix build --print-build-logs .#gfh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gfh-${{ matrix.name }}
          path: ./result/bin/gfh
          if-no-files-found: error

  create-release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2

      - name: Package artifacts
        run: |
          mkdir out
          for dir in gfh-*; do
            filename="$dir.tar.gz"
            tar czf "out/$filename" -C "$dir" .
          done
          (cd out && sha256sum ./*.tar.gz > checksums.txt)

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --draft --generate-notes --verify-tag
